name: Credential hygiene
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: node scripts/check-credential-hygiene.mjs
      - run: python3 scripts/check-credential-history.py . HEAD
