# Firebase App Hosting Configuration for Staging Environment
# Documentation: https://firebase.google.com/docs/app-hosting/configure
# This configuration is automatically merged over apphosting.yaml for staging backends.

runConfig:
  cpu: 1
  memoryMiB: 1024
  minInstances: 0
  maxInstances: 5
  concurrency: 80

# Environment variables and Cloud Secret Manager bindings for Staging
env:
  # Sensitive Server-Only Secrets (Backed by Google Cloud Secret Manager)
  - variable: STRIPE_SECRET_KEY
    secret: stripe-secret-key
    availability:
      - RUNTIME

  # All entries refer to secrets in the staging Firebase project. Secret creation
  # alone is insufficient: grant this backend access before a reviewed rollout.
  - variable: STRIPE_WEBHOOK_SECRET
    secret: stripe-webhook-secret
    availability:
      - RUNTIME

  - variable: ADDRESS_VERIFICATION_EVIDENCE_SECRET
    secret: address-verification-evidence-secret
    availability:
      - RUNTIME

  # This is a public key, but storing it centrally avoids per-backend drift.
  # Next.js needs NEXT_PUBLIC values at BUILD as well as RUNTIME.
  - variable: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
    secret: stripe-publishable-key
    availability:
      - BUILD
      - RUNTIME

  - variable: LOB_DISPATCH_API_KEY
    secret: lob-key
    availability:
      - RUNTIME

  # Override the production secret binding inherited from apphosting.yaml.
  # Deterministic staging CASS does not require a live verification key.
  - variable: LOB_ADDRESS_VERIFICATION_KEY
    value: staging_mock_cass_unused
    availability:
      - RUNTIME

  - variable: LOB_WEBHOOK_SECRET
    secret: lob-webhook-secret
    availability:
      - RUNTIME

  - variable: ADMIN_SESSION_SIGNING_KEY
    secret: admin-session-signing-key
    availability:
      - RUNTIME

  # Outbound admin correspondence is server-only; never compile into browser assets.
  - variable: RESEND_API_KEY
    secret: resend-key
    availability:
      - RUNTIME

  # Invariant 6: Staging deterministic address verification / mock CASS
  - variable: LOB_ENV
    value: staging_mock_cass
    availability:
      - RUNTIME

  # Environment identifier
  - variable: ENVIRONMENT
    value: staging
    availability:
      - BUILD
      - RUNTIME

  - variable: FIREBASE_PROJECT_ID
    value: docketstamp-staging
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: docketstamp-staging
    availability:
      - BUILD
      - RUNTIME

  # Public client configuration for Staging
  - variable: NEXT_PUBLIC_APP_URL
    value: https://staging.docketstamp.com
    availability:
      - BUILD
      - RUNTIME

  # Public Firebase web app identity; all fields must belong to the same project.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: firebase-web-api-key
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "docketstamp-staging.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "docketstamp-staging.firebasestorage.app"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "267056924276"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:267056924276:web:e8c64af5d4be3d57477321"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: "G-MR8PSNHHP9"
    availability:
      - BUILD
      - RUNTIME
