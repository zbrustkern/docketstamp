# Firebase App Hosting Configuration for Staging Environment
# Documentation: https://firebase.google.com/docs/app-hosting/configure
# This configuration is automatically merged over apphosting.yaml for staging backends.

runConfig:
  cpu: 1
  memoryMiB: 1024
  minInstances: 0
  maxInstances: 5
  concurrency: 80

# Environment variables and Cloud Secret Manager bindings for Staging
env:
  # Sensitive Server-Only Secrets (Backed by Google Cloud Secret Manager)
  - variable: STRIPE_SECRET_KEY
    secret: stripe-secret-key
    availability:
      - RUNTIME

  # Invariant 6: Staging deterministic address verification / mock CASS
  - variable: LOB_ENV
    value: staging_mock_cass
    availability:
      - RUNTIME

  # Environment identifier
  - variable: ENVIRONMENT
    value: staging
    availability:
      - BUILD
      - RUNTIME

  - variable: FIREBASE_PROJECT_ID
    value: docketstamp-staging
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: docketstamp-staging
    availability:
      - BUILD
      - RUNTIME

  # Public client configuration for Staging
  - variable: NEXT_PUBLIC_APP_URL
    value: https://staging.docketstamp.com
    availability:
      - BUILD
      - RUNTIME
