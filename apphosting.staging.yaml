# Firebase App Hosting Configuration for Staging Environment
# Documentation: https://firebase.google.com/docs/app-hosting/configure
# This configuration is automatically merged over apphosting.yaml for staging backends.

runConfig:
  cpu: 1
  memoryMiB: 1024
  minInstances: 0
  maxInstances: 5
  concurrency: 80

# Environment variables and Cloud Secret Manager bindings for Staging
env:
  # Sensitive Server-Only Secrets (Backed by Google Cloud Secret Manager)
  - variable: STRIPE_SECRET_KEY
    secret: stripe-secret-key
    availability:
      - RUNTIME

  # All entries refer to secrets in the staging Firebase project. Secret creation
  # alone is insufficient: grant this backend access before a reviewed rollout.
  - variable: STRIPE_WEBHOOK_SECRET
    secret: stripe-webhook-secret
    availability:
      - RUNTIME

  # This is a public key, but storing it centrally avoids per-backend drift.
  # Next.js needs NEXT_PUBLIC values at BUILD as well as RUNTIME.
  - variable: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
    secret: stripe-publishable-key
    availability:
      - BUILD
      - RUNTIME

  - variable: LOB_DISPATCH_API_KEY
    secret: lob-key
    availability:
      - RUNTIME

  - variable: LOB_WEBHOOK_SECRET
    secret: lob-webhook-secret
    availability:
      - RUNTIME

  - variable: ADMIN_SESSION_SIGNING_KEY
    secret: admin-session-signing-key
    availability:
      - RUNTIME

  # Outbound admin correspondence is server-only; never compile into browser assets.
  - variable: RESEND_API_KEY
    secret: resend-key
    availability:
      - RUNTIME

  # Invariant 6: Staging deterministic address verification / mock CASS
  - variable: LOB_ENV
    value: staging_mock_cass
    availability:
      - RUNTIME

  # Environment identifier
  - variable: ENVIRONMENT
    value: staging
    availability:
      - BUILD
      - RUNTIME

  - variable: FIREBASE_PROJECT_ID
    value: docketstamp-staging
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: docketstamp-staging
    availability:
      - BUILD
      - RUNTIME

  # Public client configuration for Staging
  - variable: NEXT_PUBLIC_APP_URL
    value: https://staging.docketstamp.com
    availability:
      - BUILD
      - RUNTIME
