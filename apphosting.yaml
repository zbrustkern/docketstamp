# Firebase App Hosting Configuration
# Documentation: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  cpu: 1
  memoryMiB: 1024
  minInstances: 0
  maxInstances: 10
  concurrency: 80

# Environment variables and Cloud Secret Manager bindings
# Secrets are managed via Google Cloud Secret Manager and never committed to git.
env:
  # Sensitive Server-Only Secrets (Backed by Google Cloud Secret Manager)
  - variable: STRIPE_SECRET_KEY
    secret: stripe-secret-key
    availability:
      - RUNTIME

  - variable: STRIPE_WEBHOOK_SECRET
    secret: stripe-webhook-secret
    availability:
      - RUNTIME

  # Public browser key must be available when Next.js builds the client bundle.
  - variable: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
    secret: stripe-publishable-key
    availability:
      - BUILD
      - RUNTIME

  - variable: ADMIN_SESSION_SIGNING_KEY
    secret: admin-session-signing-key
    availability:
      - RUNTIME

  # Lob uses one account-level live API key for both the address-verification
  # and letter APIs. Keep the application variables explicit so staging can
  # continue to isolate its mock/verification path from dispatch.
  - variable: LOB_DISPATCH_API_KEY
    secret: lob-secret
    availability:
      - RUNTIME

  - variable: LOB_ADDRESS_VERIFICATION_KEY
    secret: lob-secret
    availability:
      - RUNTIME

  - variable: LOB_WEBHOOK_SECRET
    secret: lob-webhook-scret
    availability:
      - RUNTIME

  # - variable: ADMIN_SECRET_KEY
  #   secret: admin-secret-key
  #   availability:
  #     - RUNTIME

  - variable: ENVIRONMENT
    value: production
    availability:
      - BUILD
      - RUNTIME

  # Enables physical-mail dispatch only in production. Staging explicitly
  # overrides this with staging_mock_cass.
  - variable: LOB_ENV
    value: live
    availability:
      - RUNTIME

  - variable: FIREBASE_PROJECT_ID
    value: docketstamp
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: docketstamp
    availability:
      - BUILD
      - RUNTIME

  # Public client configuration
  - variable: NEXT_PUBLIC_APP_URL
    value: https://docketstamp.com
    availability:
      - BUILD
      - RUNTIME

  # Public Firebase web app identity; all fields must belong to the same project.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: firebase-web-api-key
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "docketstamp.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "docketstamp.firebasestorage.app"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "937129689950"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:937129689950:web:f916267a40b9133dfcc5cf"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: "G-6M8S0RNFQM"
    availability:
      - BUILD
      - RUNTIME
